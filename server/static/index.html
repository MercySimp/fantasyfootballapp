<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DraftForge Games</title>
  <link rel="stylesheet" href="/static/games.css">
</head>
<body class="portal">
  <main class="portal-shell">
    <div class="eyebrow">DRAFTFORGE / TRIVIA GAMES</div>
    <h1>Pick your game.</h1>
    <p class="lead">Fantasy football knowledge, turned into competitive games.</p>
    <label class="select-label" for="game-select">Trivia game</label>
    <select id="game-select" class="game-select">
      <option value="darts">Stat Darts</option>
      <option value="draft">Fantasy Trivia Draft</option>
      <option value="trade">Fantasy Trade Analyzer</option>
    </select>
    <button class="primary-button" id="continue-button">Continue</button>
    <div class="portal-card">
      <strong>Stat Darts</strong>
      <span>Start from a calibrated number, name qualifying players, and check out to zero.</span>
    </div>
  </main>
  <script>
    document.getElementById("continue-button").addEventListener("click", () => {
      const game = document.getElementById("game-select").value;
      const destination = game === "darts"
        ? "/static/darts-setup.html"
        : game === "trade" ? "/static/trade.html" : "/static/draft.html";
      window.location.href = destination;
    });
  </script>
</body>
</html>
