version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fantasy_football_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasy_football
      POSTGRES_USER: fantasy_admin
      POSTGRES_PASSWORD: changeme_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_admin -d fantasy_football"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fantasy_football_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: changeme_secure_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
